<svg width="480" height="420" viewBox="0 0 480 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Event ticket with QR check-in">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#674df3"/>
      <stop offset="1" stop-color="#5238d6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30f0b6"/>
      <stop offset="1" stop-color="#1d9b6c"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- soft background blobs -->
  <circle cx="380" cy="70" r="90" fill="#674df3" opacity="0.18"/>
  <circle cx="80" cy="360" r="70" fill="#30f0b6" opacity="0.14"/>

  <!-- main ticket -->
  <g filter="url(#s)">
    <rect x="70" y="120" width="300" height="150" rx="16" fill="#ffffff"/>
    <!-- perforation -->
    <line x1="270" y1="132" x2="270" y2="258" stroke="#e6e7ec" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="270" cy="120" r="10" fill="#0f1425"/>
    <circle cx="270" cy="270" r="10" fill="#0f1425"/>

    <!-- ticket text -->
    <rect x="96" y="150" width="120" height="12" rx="6" fill="#1b1f2e"/>
    <rect x="96" y="176" width="150" height="9" rx="4.5" fill="#c1c5d4"/>
    <rect x="96" y="196" width="90" height="9" rx="4.5" fill="#c1c5d4"/>
    <rect x="96" y="228" width="70" height="18" rx="6" fill="url(#g1)"/>

    <!-- QR block -->
    <rect x="292" y="158" width="56" height="56" rx="6" fill="#0f1425"/>
    <g fill="#ffffff">
      <rect x="299" y="165" width="12" height="12"/>
      <rect x="329" y="165" width="12" height="12"/>
      <rect x="299" y="195" width="12" height="12"/>
      <rect x="317" y="177" width="6" height="6"/>
      <rect x="329" y="189" width="6" height="6"/>
      <rect x="323" y="201" width="6" height="6"/>
      <rect x="335" y="201" width="6" height="6"/>
    </g>
  </g>

  <!-- verified badge -->
  <g filter="url(#s)">
    <circle cx="330" cy="285" r="34" fill="url(#g2)"/>
    <path d="M316 285 l9 9 l17 -18" stroke="#0f1425" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
