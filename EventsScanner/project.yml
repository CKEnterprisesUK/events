# XcodeGen project definition for the EventsScanner iOS app.
#
# A .xcodeproj is a generated, machine-managed bundle that cannot be reliably
# hand-authored, so the project is described here declaratively and generated
# with XcodeGen (https://github.com/yonyz/XcodeGen):
#
#     brew install xcodegen
#     cd EventsScanner
#     xcodegen generate
#     open EventsScanner.xcodeproj
#
# See README.md for the full open/create instructions and the iOS 17 minimum /
# @Observable note.

name: EventsScanner

options:
  # Minimum deployment target iOS 17.0.
  # AppState uses the Observation @Observable macro, which requires iOS 17 at
  # runtime. The target is set to 17.0 so @Observable (and the full functional
  # app) is available unconditionally — no iOS 16 placeholder fallback.
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.events.scanner
  # Stamp the generated project as validated against the current Xcode
  # toolchain (Xcode 27). Without this the generated project carries an older
  # upgrade marker and Xcode shows the yellow "Update to recommended settings"
  # banner on open. Bumping it (plus the recommended build settings in
  # `settings.base` below) clears that banner.
  xcodeVersion: "2700"

# Per-environment build configurations (task 15.4).
#
# Two configurations bake a different API environment into each build so a
# build can only ever reach its own backend:
#
#   Debug   -> preprod  (https://preprod.events.ckent.uk, …EventsScanner.preprod)
#   Release -> production(https://events.ckent.uk,         …EventsScanner)
#
# The environment is a compile-time choice, never read from the server. Debug
# carries a PREPROD Swift compilation condition that drives a visible PREPROD
# badge (see App/AppEnvironment.swift); Release has no such flag and is treated
# as production.
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    # Xcode 27 "recommended settings". Enabling script sandboxing is the item
    # the recommended-settings audit flags for a project at this upgrade level;
    # setting it here (project-wide) clears the "Update to recommended
    # settings" banner. The app runs no build scripts, so sandboxing them is
    # safe and has no functional effect.
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # Keep the executable/product name stable even though the user-facing
    # display name is "Events by CK Enterprises" (set via CFBundleDisplayName
    # in Info.plist). PRODUCT_NAME drives the binary name, not the home-screen
    # label, so it stays as the target name to avoid touching bundle IDs.
    PRODUCT_NAME: EventsScanner

targets:
  EventsScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EventsScanner
        excludes:
          - "**/.gitkeep"
    # Info.plist contents are declared here and WRITTEN by XcodeGen on every
    # `xcodegen generate`. Anything added to the .plist by hand is overwritten,
    # so every key the app needs must live here:
    #   - APIBaseURL: the HTTPS base URL. $(API_HOST) is a per-config build
    #     setting (below) that Xcode expands when it processes the plist.
    #   - NSCameraUsageDescription: required or iOS hard-crashes the app the
    #     instant the scanner touches the camera.
    info:
      path: EventsScanner/Info.plist
      properties:
        APIBaseURL: https://$(API_HOST)
        NSCameraUsageDescription: EventsScanner uses the camera to scan QR codes for event check-in.
        # Version + build number. XcodeGen generates Info.plist from this block,
        # and without these keys it writes a DEFAULT 1.0 / 1 that overrides the
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION build settings below — so
        # a version bump never reaches the archive. Point them at the build
        # settings so the plist always inherits the single source of truth.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # User-facing name under the home-screen icon and in Settings. The
        # Xcode target, PRODUCT_NAME and bundle IDs stay "EventsScanner";
        # only the display name is rebranded.
        CFBundleDisplayName: Events by CK Enterprises
        # Short name for space-constrained UI. CFBundleName is ~15 chars max,
        # so the long display name goes in CFBundleDisplayName above.
        CFBundleName: Events
        # Navy branded launch screen (events-branding overlay). Declared here
        # because XcodeGen rewrites Info.plist on every generate; a key added
        # straight to the plist by the installer would be lost otherwise.
        UILaunchStoryboardName: LaunchScreen
        # Supported orientations. EventsScanner is a one-handed QR scanner, so
        # iPhone is locked to portrait. iPad advertises the full set of four so
        # the "all interface orientations must be supported unless the app
        # requires full screen" warning is satisfied without forcing full-screen.
        # Declared here because XcodeGen rewrites Info.plist on every generate.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ensure $(API_HOST) (a user-defined setting) is expanded into the
        # Info.plist. Build-setting expansion is on by default, but set it
        # explicitly so APIBaseURL never ships as a literal "https://$(API_HOST)".
        INFOPLIST_EXPAND_BUILD_SETTINGS: YES
      configs:
        # Preprod / staging. Distinct bundle id so it co-exists with the
        # production app on one device. API_HOST is the site root host only;
        # APIBaseURL prepends https:// (see info.properties above). The PREPROD
        # compile condition drives the on-screen PREPROD badge.
        Debug:
          API_HOST: preprod.events.ckent.uk
          PRODUCT_BUNDLE_IDENTIFIER: com.events.scanner.EventsScanner.preprod
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG PREPROD"
        # Production. No PREPROD flag -> treated as production, no badge.
        Release:
          API_HOST: events.ckent.uk
          PRODUCT_BUNDLE_IDENTIFIER: com.events.scanner.EventsScanner
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

  EventsScannerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EventsScannerTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      # Host-based (hosted) unit test bundle: it is injected into the running
      # EventsScanner app (see TEST_HOST / BUNDLE_LOADER below), which is also
      # the module the tests `@testable import`. The dependency is declared only
      # to order the build (app first) — it must NOT link or embed the app:
      # linking an `.app` as a framework is what made Xcode try to copy the
      # app's `.swiftmodule` into the test target's object dir ("Multiple
      # commands produce … EventsScanner.swiftmodule"). `@testable import`
      # resolves at test-injection time via BUNDLE_LOADER, not by linking.
      - target: EventsScanner
        embed: false
        link: false
    settings:
      base:
        # One bundle id for the test bundle under both Debug and Release so the
        # EventsScannerTests target builds and runs against either app config.
        PRODUCT_BUNDLE_IDENTIFIER: com.events.scanner.EventsScannerTests
        # Give the test bundle its own product/module name. The project-level
        # `settings.base.PRODUCT_NAME: EventsScanner` is inherited by every
        # target, so without this override the test target also produced an
        # `EventsScanner.swiftmodule` into the shared products dir — colliding
        # with the app target's module ("Multiple commands produce …
        # EventsScanner.swiftmodule"). A distinct name keeps the two modules
        # separate while `@testable import EventsScanner` still resolves against
        # the app via BUNDLE_LOADER.
        PRODUCT_NAME: EventsScannerTests
        PRODUCT_MODULE_NAME: EventsScannerTests
        # Generate the test bundle's Info.plist automatically. Without this (and
        # with no INFOPLIST_FILE), the test target has no Info.plist and code
        # signing fails: "the target does not have an Info.plist file and one is
        # not being generated automatically."
        GENERATE_INFOPLIST_FILE: YES
        # Inject the tests into the EventsScanner app (the host). This wires
        # TEST_HOST / BUNDLE_LOADER so `@testable import EventsScanner` resolves
        # against the real app module at test time.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EventsScanner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EventsScanner"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  EventsScanner:
    build:
      targets:
        EventsScanner: all
        EventsScannerTests: [test]
    test:
      targets:
        - EventsScannerTests
